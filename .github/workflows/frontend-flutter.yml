name: frontend-flutter

# Berjalan untuk setiap push dan pull request ke main/develop (lihat catatan di backend-laravel.yml)
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  periksa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ambil dependensi
        run: flutter pub get

      - name: Periksa kode (analyze)
        run: flutter analyze

      - name: Jalankan test
        run: flutter test
