name: frontend-flutter

# Berjalan untuk setiap push dan pull request ke main/develop (lihat catatan di backend-laravel.yml)
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  periksa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Versi dikunci sama dengan yang dipakai tim. Dengan "stable" tanpa versi, CI
      # ikut Flutter terbaru: sejak 3.47 package:flutter/material.dart ditandai
      # deprecated sehingga flutter analyze gagal di seluruh file. Naikkan versi ini
      # bersamaan dengan migrasi kodenya.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Ambil dependensi
        run: flutter pub get

      - name: Periksa kode (analyze)
        run: flutter analyze

      - name: Jalankan test
        run: flutter test
