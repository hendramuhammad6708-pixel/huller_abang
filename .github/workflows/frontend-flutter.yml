name: frontend-flutter

on:
  push:
    branches: [feature/fe-flutter]
  pull_request:
    branches: [feature/fe-flutter]

jobs:
  periksa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ambil dependensi
        run: flutter pub get

      - name: Periksa kode (analyze)
        run: flutter analyze

      - name: Jalankan test
        run: flutter test
